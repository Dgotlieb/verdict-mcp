[project]
name = "verdict-mcp"
version = "0.1.0a2"
description = "Structured, sandboxed verification feedback for coding agents. An MCP server that turns raw test/lint output into tiny, typed verdicts with failure fingerprints and history."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Gotlieb", email = "dgotlieb8@gmail.com" }]
keywords = ["mcp", "agents", "testing", "pytest", "ai", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastmcp>=2.10",
    "pydantic>=2.7",
    "grimp>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-json-report>=1.5",
    "ruff>=0.6",
]

[project.scripts]
verdict-mcp = "verdict_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Dgotlieb/verdict-mcp"
Issues = "https://github.com/Dgotlieb/verdict-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "container: needs a reachable container engine (docker/podman); skipped otherwise",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
